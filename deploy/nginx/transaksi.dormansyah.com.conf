# Tukangsync -- nginx di depan Laravel Octane (FrankenPHP)
#
# Dipasang oleh deploy/setup-server.sh ke
#   /etc/nginx/sites-available/tukangsync.conf
# (nama domain diganti otomatis bila DOMAIN=... berbeda).
#
# nginx TIDAK menjalankan PHP. Octane menjadi server HTTP di 127.0.0.1:8010;
# nginx hanya mengurus TLS, berkas statis, dan meneruskan sisanya.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tukangsync_octane {
    server 127.0.0.1:8010 fail_timeout=0;
    keepalive 32;
}

# ---------------------------------------------------------------- HTTP -> HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name transaksi.dormansyah.com www.transaksi.dormansyah.com;

    # certbot memperbarui sertifikat lewat jalur ini.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://transaksi.dormansyah.com$request_uri;
    }
}

# --------------------------------------------------------------------- APLIKASI
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name transaksi.dormansyah.com;

    root  /var/www/tukangsync/current/public;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/transaksi.dormansyah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transaksi.dormansyah.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Foto struk sampai 8 MB dan bukti transfer sampai 5 MB. Bawaan nginx
    # (1 MB) menolak dengan 413 sebelum permintaan sampai ke Laravel.
    client_max_body_size 12M;
    client_body_timeout  120s;

    # Header keamanan TIDAK dipasang di sini: semuanya dikirim aplikasi
    # (App\Http\Middleware\SecurityHeaders). Header ganda membuat browser
    # mengabaikan keduanya.

    access_log /var/log/nginx/tukangsync.access.log;
    error_log  /var/log/nginx/tukangsync.error.log;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      application/json application/javascript text/css text/plain
                    image/svg+xml application/xml application/manifest+json;

    # Berkas tersembunyi (.env, .git) tidak pernah dilayani.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Tidak ada daftar isi folder.
    autoindex off;

    # Jangan pernah mengeksekusi/menyajikan skrip dari folder unggahan.
    location ~* ^/storage/.*\.(php|phtml|phar|html?|svg)$ {
        deny all;
    }

    # Aset statis (Metronic di /assets, Swagger UI, favicon, manifest).
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|map|webmanifest)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri @octane;
    }

    location / {
        try_files $uri @octane;
    }

    location @octane {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # PDF laporan bisa memakan waktu pada rekap besar.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_pass http://tukangsync_octane;
    }
}
